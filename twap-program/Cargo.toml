[package]
name = "twap-program"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "twap_program"
path = "src/lib.rs"

[features]
no-entrypoint = []

[dependencies]
percolator-accounting = { path = "../percolator-accounting" }
solana-program = { workspace = true }
spl-token = { workspace = true }

[dev-dependencies]
solana-sdk = { workspace = true }
litesvm = { workspace = true }
spl-token = { version = "4.0", features = ["no-entrypoint"] }
percolator-prog = { workspace = true }
market-controller-program = { path = "../market-controller", features = ["no-entrypoint"] }
percolator = { workspace = true }
solana-program-runtime = "1.18"
