# Deterministic fixed-supply and TWAP-funded COIN reward epochs.
[package]
name = "residual-distributor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "residual_distributor"
path = "src/lib.rs"

[features]
no-entrypoint = []

[dependencies]
solana-program = { workspace = true }
spl-token = { workspace = true }
percolator-accounting = { path = "../percolator-accounting" }

[dev-dependencies]
solana-sdk = { workspace = true }
litesvm = { workspace = true }
spl-token = { version = "4.0", features = ["no-entrypoint"] }
distribution-program = { path = "../distribution", features = ["no-entrypoint"] }
subledger-program = { path = "../subledger", features = ["no-entrypoint"] }
percolator-prog = { workspace = true }
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "4bf72ea3f9bea8682fe23b5c6fff9e04b5fb41d3" }
