[workspace]
members = ["percolator-accounting", "subledger", "distribution", "twap", "twap-program", "market-controller", "genesis-vote", "setup", "residual-distributor", "sim"]
resolver = "2"

[workspace.dependencies]
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
solana-sdk = "1.18"
litesvm = "0.1"
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "4bf72ea3f9bea8682fe23b5c6fff9e04b5fb41d3" }
percolator-prog = { git = "file:///home/anatoly/percolator-prog", rev = "19f3b494049b2dfcbf8881366443c611c4e09290", default-features = false, features = ["no-entrypoint"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = true
