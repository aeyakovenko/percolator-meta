[workspace]
members = ["percolator-accounting", "subledger", "distribution", "twap", "twap-program", "market-controller", "genesis-vote", "setup", "residual-distributor", "sim"]
resolver = "2"

[workspace.dependencies]
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
solana-sdk = "1.18"
litesvm = "0.1"
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "4c9cfa68e483f708819098a4065757a21c9662e3" }
percolator-prog = { git = "https://github.com/aeyakovenko/percolator-prog", rev = "0dcf5002c322b88d41638dad00e3d9d49aefa185", default-features = false, features = ["no-entrypoint"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = true
