[workspace]
members = ["percolator-accounting", "subledger", "distribution", "twap", "twap-program", "market-controller", "genesis-vote", "setup", "residual-distributor", "sim"]
resolver = "2"

[workspace.dependencies]
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
solana-sdk = "1.18"
litesvm = "0.1"
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "5d608a8653a4d2535b3ff7d3a011ccc8f4accc23" }
percolator-prog = { git = "https://github.com/aeyakovenko/percolator-prog", rev = "541ea56419081fe63120db45563e7bf3e47938bc", default-features = false, features = ["no-entrypoint"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = true
