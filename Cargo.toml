[workspace]
members = ["percolator-accounting", "subledger", "distribution", "twap", "twap-program", "market-controller", "genesis-vote", "setup", "residual-distributor", "sim"]
resolver = "2"

[workspace.dependencies]
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
solana-sdk = "1.18"
litesvm = "0.1"
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "dca48d20ef3bc653c11c723e483924ee8ab05549" }
percolator-prog = { git = "https://github.com/aeyakovenko/percolator-prog", rev = "1aac6a05f6aaf9d342252223deb060ffcd4eb4cd", default-features = false, features = ["no-entrypoint"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = true
